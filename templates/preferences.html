<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences | Time Manager</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body class="flex min-h-dvh">
    <div class="relative flex grow flex-col items-center justify-center mx-4">
        <nav class="flex justify-between items-center w-full h-[5%]">
            <header>
                <h2>Time Manager</h2>
            </header>
            <a href="/profile">Back</a>
        </nav>
    
        
        <main class="relative flex w-full grow flex-col items-center mt-10">
            <h1 class="font-semibold text-[32px]">Preferences</h1>
            
            <div class="mt-10 w-1/2 min-w-52">
                <div class="flex flex-col items-center md:max-w-2xl">
                    <form  class="flex flex-col w-full"method="post" action="">
                        <div class="mb-7">
                            <div class="floating-label-get-ready">
                                <input type="text" id="windDownLength" name="windDownLength"><br>
                                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[52%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="windDownLength">Wind Down Length</label>
                            </div>
                        </div>

                        <div class="mb-7">
                            <div class="floating-label-get-ready">
                                <input type="text" id="sleepLength" name="sleepLength"><br>
                                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[52%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="sleepLength">Sleep Length</label>
                            </div>
                        </div>

                        <div class="mb-7">
                            <div class="floating-label-get-ready">
                                <input type="text" id="prepLength" name="prepLength"><br>
                                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[52%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="prepLength">Prep Length</label>
                            </div>
                        </div>

                        <div class="mb-7">
                            <div class="floating-label-get-ready">
                                <input type="text" id="showerLength" name="showerLength"><br>
                                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[52%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="showerLength">Shower Length</label>
                            </div>
                        </div>

                        <div class="mb-7">
                            <div class="floating-label-get-ready">
                                <input type="text" id="getReadyLength" name="getReadyLength"><br>
                                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[52%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="getReadyLength">Get Ready Length</label>
                            </div>
                        </div>

                        <div class="mb-7">
                            <div class="floating-label-get-ready">
                                <input type="text" id="fluffLength" name="fluffLength">
                                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[52%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="fluffLength">Fluff Length</label>
                            </div>
                        </div>

                        <div class="flex flex-col w-full">
                            <button class="btn-primary mt-2 w-full" type="button" id="preferences">Save Changes</button>
                            <button class="btn-primary mt-2 w-full" type="button" id="defaultLength">Default Lengths</button>
                            <input class="btn-secondary mt-2 w-full" type="reset" value="Clear">
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/static/js/script.js"></script>
</body>
</html>
