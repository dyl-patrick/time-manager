<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
    <style>
        /*
        Collapsible
        */

        .content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.2s ease-out;
        }

        /*
        Toggle Edit Button
        */
        #toggleDiv {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 5px;
            width: 200px;
        }

    </style>
    <title>Event History | Time Manager</title>
</head>
<body class="flex flex-col min-h-dvh">

    <div class="relative flex grow flex-col items-center justify-center mx-4">
        <nav class="flex justify-between items-center w-full h-11">
            <header>
                <h2>Time Manager</h2>
            </header>
            <a href="/dashboard">Back</a>
        </nav>
    </div>

    <main class="relative flex w-full grow flex-col items-center mt-10">
        <h1 class="font-semibold text-[32px]">Event History</h1>
        <button class="mt-2.5 underline mb-10" type="button" id="edit">Edit Events</button>
    
        <div class="toggleDiv w-1/2" style="display: none;">
            <div class="mb-7" id="dateSelector">
                <div class="floating-label-get-ready">
                    <input type="date" id="selectDate" name="selectDate" placeholder=" ">
                    <label for="selectDate">Event Date</label><br>
                </div>
        
                <button class="btn-primary mt-2 w-full" type="button" id="requestDates">Find Events</button>
            </div>
            
            <div id="eventEntries">
                

            </div>
        </div>
    
        <div class="w-1/2" id="eventsContainer">
    

        </div>
    </main>


    <script type="module" src="/static/js/script.js"></script>
</body>
</html>
