<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Preferences | Time Manager</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body>

    <form action="">
        <h3 class="font-semibold">Create Time Lengths <span>(info button)</span></h3>
        <p>Place Holder for Explanation of Lengths</p>
        <p>FIX: Create Preferences must read user ID after user creation.</p>
        <p>FIX: Look into getUserID as possible solution!!!</p>

        <section class="mt-5">
            <div class="mb-7 floating-label">
                <input class="peer" type="text" id="windDownLength" name="windDownLength" placeholder=" " required>
                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[53%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="windDownLength">Wind Down Length<small class="text-xs">*</small></label>
            </div>
            <div class="mb-7 floating-label">
                <input class="peer" type="text" id="sleepLength" name="sleepLength" placeholder=" " required>
                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[53%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="sleepLength">Sleep Length<small class="text-xs">*</small></label>
            </div>
            <div class="mb-7 floating-label">
                <input class="peer" type="text" id="prepLength" name="prepLength" placeholder=" " required>
                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[53%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="prepLength">Prep Length<small class="text-xs">*</small></label>
            </div>
            <div class="mb-7 floating-label">
                <input class="peer" type="text" id="showerLength" name="showerLength" placeholder=" " required>
                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[53%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="showerLength">Shower Length<small class="text-xs">*</small></label>
            </div>
            <div class="mb-7 floating-label">
                <input class="peer" type="text" id="getReadyLength" name="getReadyLength" placeholder=" " required>
                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[53%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="getReadyLength">Get Ready Length<small class="text-xs">*</small></label>
            </div>
            <div class="mb-5 floating-label">
                <input class="peer" type="text" id="fluffLength" name="fluffLength" placeholder=" " required>
                <label class="text-sm font-medium text-gray-700 absolute left-0 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-[53%] peer-focus:top-0 peer-focus:text-indigo-500 peer-focus:text-sm" for="fluffLength">Fluff Length<small class="text-xs">*</small></label>
            </div>
        </section>
        <div class="flex flex-col w-full">
            <div class="md:flex md:flex-row md:space-x-2">
                <button class="btn-secondary mt-2 w-full" type="button" id="defaultLength">Default Lengths</button>
                <input class="btn-secondary mt-2 w-full" type="reset" value="Clear">
            </div>
            <button class="btn-primary mb-2 my-2" type="button" id="createPreferences">Create Preferences</button>
        </div>

    </form>
    

    <script type="module" src="/static/js/script.js"></script>
</body>
</html>
